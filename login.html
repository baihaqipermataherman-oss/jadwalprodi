<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Sistem Informasi Jadwal Akademik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #198754 0%, #0d6efd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="fa fa-graduation-cap fa-3x text-success mb-2"></i>
        <h4 class="fw-bold mb-0">Login Admin</h4>
        <p class="text-muted small mb-0">Sistem Informasi Jadwal Akademik</p>
      </div>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" onsubmit="return prosesLogin(event)">
        <div class="mb-3">
          <label class="form-label fw-bold">Email</label>
          <input type="email" id="inputEmail" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Password</label>
          <input type="password" id="inputPassword" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-success w-100" id="btnLogin">
          <i class="fa fa-right-to-bracket me-1"></i> Masuk
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    // Jika sudah login, langsung lempar ke portal
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    async function prosesLogin(e) {
      e.preventDefault();
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value;
      const btn = document.getElementById('btnLogin');
      const alertBox = document.getElementById('alertBox');

      alertBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Memproses...';

      const res = await loginAdmin(email, password);

      if (res.success) {
        window.location.href = 'index.html';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-right-to-bracket me-1"></i> Masuk';
        alertBox.innerText = 'Login gagal: ' + res.error;
        alertBox.classList.remove('d-none');
      }
      return false;
    }
  </script>
</body>
</html>
